name: Custom Docker Image

on:
    push:
        branches:
            - custom
        paths:
            - '.github/workflows/custom-image.yml'
            - 'lib/**'
            - '!lib/**/*.test.ts'
            - 'Dockerfile'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'patches/**'
            - 'scripts/docker/**'
            - 'tsconfig.json'
    workflow_dispatch: {}

concurrency:
    group: custom-docker-image
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ghcr.io/1323216010/rsshub:custom
                      ghcr.io/1323216010/rsshub:custom-${{ github.sha }}
                  cache-from: type=gha,scope=custom-rsshub
                  cache-to: type=gha,mode=max,scope=custom-rsshub


